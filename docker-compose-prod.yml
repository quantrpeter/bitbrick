# Production stack for BitBrick, modelled on wps/docker-compose-prod.yml.
#
#   cp .env.prod.example .env.prod      # then fill in the secrets (this file is git-ignored)
#   docker compose --env-file .env.prod -f docker-compose-prod.yml up -d
#
# This file contains no secrets: everything sensitive comes from .env.prod.
name: bitbrick

services:
  app:
    image: quantrpeter/bitbrick:${BITBRICK_VERSION:-1.0}
    ports:
      - "8003:80"            # reverse proxy / CDN terminates TLS and forwards here
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      LOG_CHANNEL: stack
      LOG_STACK: single,stderr
      FILESYSTEM_DISK: local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bitbrick-storage:/var/www/html/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command: ["mysqld", "--disable-log-bin"]
    ports:
      - "33309:3306"
    # No host port on purpose: only the app container needs the database.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env.prod}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env.prod}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
    volumes:
      - ./bitbrick-mysql:/var/lib/mysql
      - ./docker/mysql.cnf:/etc/mysql/conf.d/bitbrick.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8009:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    # No host port on purpose.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./bitbrick-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
